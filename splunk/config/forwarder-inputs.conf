# Universal Forwarder inputs.conf (Windows endpoints: Domain Controller + client)
# Location: %ProgramFiles%\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Collects Security, System and Sysmon operational logs into the wineventlog index.

[WinEventLog://Security]
index = wineventlog
disabled = false

[WinEventLog://System]
index = wineventlog
disabled = false

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
index = wineventlog
disabled = false
renderXml = false
