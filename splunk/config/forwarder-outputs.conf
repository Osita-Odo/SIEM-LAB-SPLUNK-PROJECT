# Universal Forwarder outputs.conf (Windows endpoints)
# Location: %ProgramFiles%\SplunkUniversalForwarder\etc\system\local\outputs.conf
# Forwards to the Splunk indexer over the private VNet address on TCP 9997.
# The real indexer IP is intentionally redacted; substitute your own.

[tcpout]
defaultGroup = default-autolb-group

[tcpout:default-autolb-group]
server = <SPLUNK_INDEXER_PRIVATE_IP>:9997
